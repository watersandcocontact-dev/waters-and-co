<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>{% block title %}Ops Hub — Waters & Co{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="topbar-row">
      <h1>Waters <em>&amp;</em> Co <span class="tag">Ops Hub</span></h1>
      <button class="nav-toggle" type="button" aria-label="Menu" onclick="document.querySelector('nav').classList.toggle('open')">☰</button>
    </div>
    <nav>
      <a href="{{ url_for('main.daily_queue') }}">Daily Queue</a>
      <a href="{{ url_for('main.lines_index') }}">Business Lines</a>
      <a href="{{ url_for('main.all_leads') }}">All Cases</a>
      <a href="{{ url_for('main.due_this_week') }}">Due This Week</a>
      <a href="{{ url_for('main.expansion') }}">Expansion Budget</a>
      <a href="{{ url_for('main.tax_dashboard') }}">Tax Tracking</a>
      <a href="{{ url_for('main.new_lead') }}" class="nav-cta">+ New Lead</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
