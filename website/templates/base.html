<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Waters &amp; Co{% endblock %}</title>
  <meta name="description" content="{% block meta_description %}Waters &amp; Co — Australia-wide service specialists.{% endblock %}">
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='img/favicon.ico') }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='img/favicon-32.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='img/apple-touch-icon.png') }}">
  <meta property="og:title" content="Waters &amp; Co">
  <meta property="og:description" content="Australia-wide service specialists.">
  <meta property="og:image" content="{{ url_for('static', filename='img/og-banner.png', _external=True) }}">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="{{ url_for('main.landing') }}">
        <img class="brand-img" src="{{ url_for('static', filename='img/wordmark-gold-header.png') }}" alt="Waters &amp; Co">
      </a>
      <nav>
        <a href="{{ url_for('main.enquire') }}">Contact</a>
      </nav>
    </div>
  </header>
  <main class="wrap fade-in">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <div class="wrap">
      <a class="enquire-link" href="{{ url_for('main.enquire') }}">Don't see what you're looking for? Get in touch</a>
    </div>
  </footer>
</body>
</html>
