<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Waters &amp; Co{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="{{ url_for('main.landing') }}">Waters <em>&amp;</em> Co</a>
      <nav>
        <a href="{{ url_for('main.enquire') }}">Contact</a>
      </nav>
    </div>
  </header>
  <main class="wrap fade-in">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <div class="wrap">
      <a class="enquire-link" href="{{ url_for('main.enquire') }}">Don't see what you're looking for? Get in touch</a>
    </div>
  </footer>
</body>
</html>
